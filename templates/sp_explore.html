<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Cairo', system-ui, sans-serif;
            background: var(--primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 10px;
        }
        #sp-explore-tab {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="sp-explore-tab">
        {% include '_sp_explore_inner.html' %}
    </div>

    {% include '_sp_explore_script.html' %}
</body>
</html>
