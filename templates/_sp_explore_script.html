                loadingBrowse: 'جاري تحميل محتويات المجلد…',

                errorTipCookies: 'نصيحة: أعد حل الرابط أو حدّث FedAuth/rtFa من إعدادات الاتصال.',

                folderEmpty: 'هذا المجلد فارغ.',
                selectAll: 'تحديد الكل',
                clearSelection: 'إلغاء التحديد',
                itemsInFolder: 'عنصراً في هذا المجلد',
                colType: 'النوع',
                colName: 'الاسم',

                colOpen: 'فتح',
                typeFolder: 'مجلد',
                typeFile: 'ملف',
                btnOpenFolder: 'فتح',
                openFolderTitle: 'فتح هذا المجلد وعرض محتوياته',
                selectAllTitle: 'تحديد كل الصفوف',
                clearSelectionTitle: 'إلغاء تحديد الكل',
                pasteFirst: 'الصق الرابط أولاً',
                resolving: 'جاري حل الرابط…',
                resolveFailed: 'تعذر حل الرابط',
                resolveDone: 'تم:',
                linkResolvedLoading: 'تم حل الرابط — جاري التحميل',
                connectionError: 'خطأ في الاتصال',
                loadedCounts: 'تم التحميل: {folders} مجلد(ات)، {files} ملف(ات)',
                selectOneRow: 'حدد صفاً واحداً على الأقل',
                saveFailed: 'فشل الحفظ',
                mergedReload: 'تم دمج {n} عنصر(ات) — إعادة التحميل',
            },
        };

        const SPX_LANG_KEY = 'sp_explore_lang';
        let spxLang = (localStorage.getItem(SPX_LANG_KEY) === 'ar') ? 'ar' : 'en';
        let __SPX_LAST_BROWSE_DATA = null;

        function spxT(key) {
            const b = SPX_I18N[spxLang] || SPX_I18N.en;
            const f = SPX_I18N.en;
            return (b[key] !== undefined && b[key] !== '') ? b[key] : (f[key] || key);
        }

        function spxTf(key, vars) {
            let s = spxT(key);
            if (vars) {
                Object.keys(vars).forEach((k) => {
                    s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), String(vars[k]));
                });
            }
            return s;
        }

        function spxPickApiText(data, baseKey) {
            if (!data) return '';
            if (spxLang === 'ar' && data[baseKey + '_ar']) return String(data[baseKey + '_ar']);
            if (data[baseKey + '_en']) return String(data[baseKey + '_en']);
            if (data[baseKey]) return String(data[baseKey]);
            return '';
        }

        function spxHostEl() {
            return document.querySelector('#sp-explore-tab .sp-explore-host');
        }
        function spxApplyLang() {
            localStorage.setItem(SPX_LANG_KEY, spxLang);
            const host = spxHostEl();
            if (host) {
                host.setAttribute('lang', spxLang === 'ar' ? 'ar' : 'en');
                host.setAttribute('dir', spxLang === 'ar' ? 'rtl' : 'ltr');
            }
            if (!host) return;
            host.querySelectorAll('[data-i18n]').forEach((el) => {
                const k = el.getAttribute('data-i18n');
                if (k) el.textContent = spxT(k);
            });
            host.querySelectorAll('[data-i18n-html]').forEach((el) => {
                const k = el.getAttribute('data-i18n-html');
                if (k) el.innerHTML = spxT(k);
            });
            host.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const k = el.getAttribute('data-i18n-placeholder');
                if (k) el.placeholder = spxT(k);
            });
            const ben = document.getElementById('spx-lang-en');
            const bar = document.getElementById('spx-lang-ar');
            if (ben && bar) {
                ben.classList.toggle('active', spxLang === 'en');
                bar.classList.toggle('active', spxLang === 'ar');
            }
            if (__SPX_LAST_BROWSE_DATA) exploreRenderTable(__SPX_LAST_BROWSE_DATA);
        }

        document.getElementById('spx-lang-en').addEventListener('click', () => { spxLang = 'en'; spxApplyLang(); });
        document.getElementById('spx-lang-ar').addEventListener('click', () => { spxLang = 'ar'; spxApplyLang(); });
        const spxBackDash = document.getElementById('spx-back-dashboard');
        if (spxBackDash && typeof switchTab === 'function') {
            spxBackDash.addEventListener('click', () => {
                const nav = document.getElementById('nav-sp');
                if (nav) switchTab('sp-tab', nav);
            });
        }

        let exploreHistory = [];
        let sessionPrimeUrl = '';
        let sessionSharingUrl = '';

        function showToast(msg, isErr) {
            const t = document.getElementById('spx-toast');
            if (!t) return;
            t.textContent = msg;
            t.className = 'spx-toast show' + (isErr ? ' err' : '');
            setTimeout(() => t.classList.remove('show'), 4500);
        }

        function exploreShowLoading(message) {
            const wrap = document.getElementById('spx-results');
            wrap.innerHTML = '';
            const p = document.createElement('p');
            p.className = 'explore-browse-loading';
            p.textContent = message || spxT('loadingBrowse');
            wrap.appendChild(p);
        }

        function exploreShowBrowseError(title, status, rawText, data) {
            const wrap = document.getElementById('spx-results');
            wrap.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'explore-browse-error';
            const head = document.createElement('div');
            head.style.fontWeight = '700';
            head.style.marginBottom = '8px';
            const t = title || spxT('browseFailed');
            const m = t.match(/HTTP\s+(\d{3})/i);
            if (m && status && String(status) === m[1]) {
                head.textContent = t;
            } else if (status) {
                head.textContent = t + ' (HTTP ' + status + ')';
            } else {
                head.textContent = t;
            }
            box.appendChild(head);
            const perm = spxPickApiText(data, 'permission_hint');
            if (perm) {
                const ph = document.createElement('div');
                ph.style.marginTop = '10px';
                ph.style.fontSize = '0.86rem';
                ph.style.lineHeight = '1.45';
                ph.textContent = perm;
                box.appendChild(ph);
            }
            if (data && data.body_snippet) {
                const sn = document.createElement('div');
                sn.style.marginTop = '6px';
                sn.style.fontSize = '0.8rem';
                sn.style.opacity = '0.95';
                sn.textContent = String(data.body_snippet).slice(0, 900);
                box.appendChild(sn);
            }
            if (rawText && (!data || !data.body_snippet)) {
                const sn = document.createElement('div');
                sn.style.marginTop = '6px';
                sn.style.fontSize = '0.78rem';
                sn.textContent = String(rawText).slice(0, 900);
                box.appendChild(sn);
            }
            if (data && data.content_type) {
                const ct = document.createElement('div');
                ct.style.marginTop = '8px';
                ct.style.fontSize = '0.75rem';
                ct.textContent = spxT('contentTypeLabel') + ' ' + data.content_type;
                box.appendChild(ct);
            }
            const hint = document.createElement('div');
            hint.style.marginTop = '10px';
            hint.style.fontSize = '0.8rem';
            hint.textContent = spxT('errorTipCookies');
            box.appendChild(hint);
            wrap.appendChild(box);
        }

        async function browseFolder(inputId) {
            try {
                const res = await fetch('/api/browse_folder');
                const data = await res.json();
                if (data.path) document.getElementById(inputId).value = data.path;
            } catch (e) { console.error(e); }
        }

        function localJoinPath(root, name) {
            const r = (root || '').trim();
            if (!r) return name;
            const sep = r.includes('\\') ? '\\' : '/';
            return r.replace(/[\\/]+$/, '') + sep + name;
        }

        document.getElementById('spx-resolve').addEventListener('click', async () => {
            const raw = document.getElementById('spx-paste').value.trim();
            if (!raw) { showToast(spxT('pasteFirst'), true); return; }
            const meta = document.getElementById('spx-resolve-meta');
            meta.style.display = 'block';
            meta.textContent = '⏳ ' + spxT('resolving');
            try {
                const res = await fetch('/sp/resolve_url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: raw }),
                });
                const data = await res.json();
                if (!data.success) {
                    meta.textContent = (data.error || spxT('resolveFailed')) + (data.hint ? ' — ' + data.hint : '');
                    showToast(data.error || spxT('resolveFailed'), true);
                    return;
                }
                document.getElementById('spx-parent').value = data.browse_parent || '';
                exploreHistory = [];
                sessionPrimeUrl = (data.final_url || '').trim();
                sessionSharingUrl = (data.sharing_url || '').trim();
                if (!sessionSharingUrl && /:[fwx]:\//i.test(raw)) sessionSharingUrl = raw;
                meta.textContent = spxT('resolveDone') + ' ' + (data.resolved_from || '') + (data.final_url ? ' ← ' + data.final_url : '');
                showToast(spxT('linkResolvedLoading'), false);
                exploreRun();
            } catch (e) {
                meta.textContent = spxT('connectionError');
                showToast(spxT('connectionError'), true);
            }
        });

        function exploreRun() {
            const parentInput = document.getElementById('spx-parent');
            let parent = (parentInput.value || '').trim();
            if (!parent.startsWith('/')) parent = '/' + parent;
            parentInput.value = parent;
            const bc = document.getElementById('spx-bc');
            bc.textContent = exploreHistory.length
                ? exploreHistory.map((h) => h.name || h.rel_url).join(' / ') + ' / '
                : '';
            const browsePayload = { parent_rel_url: parent };
            let prime = (sessionPrimeUrl || '').trim();
            if (!prime) {
                const paste = document.getElementById('spx-paste').value.trim();
                if (paste.toLowerCase().startsWith('http') && paste.toLowerCase().includes('sharepoint')) {
                    prime = paste;
                }
            }
            if (prime) browsePayload.prime_url = prime;
            const shareLink = (sessionSharingUrl || '').trim();
            if (shareLink) browsePayload.sharing_link_url = shareLink;

            exploreShowLoading();

            fetch('/sp/browse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(browsePayload),
            })
                .then(async (r) => {
                    const text = await r.text();
                    let data = {};
                    try {
                        data = text ? JSON.parse(text) : {};
                    } catch (e) {
                        exploreShowBrowseError(spxT('invalidJson'), r.status, text, null);
                        showToast(spxT('invalidServerResponse'), true);
                        __SPX_LAST_BROWSE_DATA = null;
                        return;
                    }
                    if (!r.ok || !data.success) {
                        exploreShowBrowseError(data.error || spxT('browseFailed'), r.status, text, data);
                        showToast(data.error || spxT('browseFailed'), true);
                        __SPX_LAST_BROWSE_DATA = null;
                        return;
                    }
                    if (data.parent) parentInput.value = data.parent;
                    exploreRenderTable(data);
                    const nf = (data.folders && data.folders.length) || 0;
                    const nfi = (data.files && data.files.length) || 0;
                    if (nf + nfi > 0) {
                        showToast(spxTf('loadedCounts', { folders: nf, files: nfi }), false);
                    }
                })
                .catch((e) => {
                    exploreShowBrowseError(spxT('networkError'), '', String(e && e.message ? e.message : e), null);
                    showToast(spxT('connectionError'), true);
                    __SPX_LAST_BROWSE_DATA = null;
                });
        }

        function exploreRenderTable(data) {
            if (!data || data.success === false) return;
            __SPX_LAST_BROWSE_DATA = data;
            const wrap = document.getElementById('spx-results');
            const root = document.getElementById('spx-local-root').value.trim();
            const folders = data.folders || [];
            const files = data.files || [];
            if (!folders.length && !files.length) {
                wrap.innerHTML = '';
                const p1 = document.createElement('p');
                p1.className = 'muted';
                p1.style.marginTop = '10px';
                p1.textContent = spxT('folderEmpty');
                wrap.appendChild(p1);
                const hintText = spxPickApiText(data, 'hint');
                if (hintText.trim()) {
                    const p2 = document.createElement('p');
                    p2.className = 'muted';
                    p2.style.marginTop = '8px';
                    p2.textContent = hintText;
                    wrap.appendChild(p2);
                }
                return;
            }
            const bar = document.createElement('div');
            bar.className = 'explore-select-bar';
            const btnAll = document.createElement('button');
            btnAll.type = 'button';
            btnAll.className = 'btn btn-outline btn-small';
            btnAll.textContent = spxT('selectAll');
            btnAll.title = spxT('selectAllTitle');
            const btnNone = document.createElement('button');
            btnNone.type = 'button';
            btnNone.className = 'btn btn-outline btn-small';
            btnNone.textContent = spxT('clearSelection');
            btnNone.title = spxT('clearSelectionTitle');
            const countHint = document.createElement('span');
            countHint.className = 'muted';
            const n = folders.length + files.length;
            countHint.textContent = n + ' ' + spxT('itemsInFolder');
            bar.appendChild(btnAll);
            bar.appendChild(btnNone);
            bar.appendChild(countHint);

            const table = document.createElement('table');
            table.className = 'explore-table';
            const thead = document.createElement('thead');
            const trh = document.createElement('tr');
            ['', spxT('colType'), spxT('colName'), spxT('colLocal'), spxT('colOpen')].forEach((h) => {
                const th = document.createElement('th');
                th.textContent = h;
                trh.appendChild(th);
            });
            thead.appendChild(trh);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');

            folders.forEach((fo) => {
                const tr = document.createElement('tr');
                tr.className = 'ex-row-folder';
                tr.dataset.relUrl = fo.rel_url;
                tr.dataset.name = fo.name;
                const td0 = document.createElement('td');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'ex-pick ex-folder-check';
                td0.appendChild(cb);
                tr.appendChild(td0);
                const tdKind = document.createElement('td');
                tdKind.className = 'explore-kind';
                tdKind.textContent = spxT('typeFolder');
                tr.appendChild(tdKind);
                const tdName = document.createElement('td');
                tdName.textContent = fo.name;
                tr.appendChild(tdName);
                const tdPath = document.createElement('td');
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.className = 'form-input ex-local-path';
                inp.value = localJoinPath(root, fo.name);
                tdPath.appendChild(inp);
                tr.appendChild(tdPath);
                const tdBtn = document.createElement('td');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline btn-small';
                btn.textContent = spxT('btnOpenFolder');
                btn.title = spxT('openFolderTitle');
                btn.addEventListener('click', () => {
                    const cur = document.getElementById('spx-parent').value.trim();
                    exploreHistory.push({ rel_url: cur, name: fo.name || fo.rel_url });
                    document.getElementById('spx-parent').value = fo.rel_url;
                    exploreRun();
                });
                tdBtn.appendChild(btn);
                tr.appendChild(tdBtn);
                tbody.appendChild(tr);
            });

            files.forEach((fi) => {
                const tr = document.createElement('tr');
                tr.className = 'ex-row-file';
                tr.dataset.relUrl = fi.rel_url;
                tr.dataset.name = fi.name;
                const td0 = document.createElement('td');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'ex-pick ex-file-check';
                td0.appendChild(cb);
                tr.appendChild(td0);
                const tdKind = document.createElement('td');
                tdKind.className = 'explore-kind';
                const mb = fi.size != null ? (Number(fi.size) / 1024 / 1024).toFixed(2) + ' MB' : '—';
                tdKind.textContent = spxT('typeFile') + ' (' + mb + ')';
                tr.appendChild(tdKind);
                const tdName = document.createElement('td');
                tdName.textContent = fi.name;
                tr.appendChild(tdName);
                const tdPath = document.createElement('td');
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.className = 'form-input ex-local-path';
                inp.value = localJoinPath(root, fi.name);
                tdPath.appendChild(inp);
                tr.appendChild(tdPath);
                tr.appendChild(document.createElement('td'));
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            wrap.innerHTML = '';
            wrap.appendChild(bar);
            wrap.appendChild(table);

            function allPickCheckboxes() {
                return wrap.querySelectorAll('.ex-pick');
            }
            btnAll.addEventListener('click', () => {
                allPickCheckboxes().forEach((cb) => { cb.checked = true; });
            });
            btnNone.addEventListener('click', () => {
                allPickCheckboxes().forEach((cb) => { cb.checked = false; });
            });
        }

        document.getElementById('spx-back').addEventListener('click', () => {
            if (!exploreHistory.length) return;
            const prev = exploreHistory.pop();
            document.getElementById('spx-parent').value = prev.rel_url;
            exploreRun();
        });

        document.getElementById('spx-browse').addEventListener('click', exploreRun);

        document.getElementById('spx-bulk').addEventListener('click', () => {
            const items = [];
            document.querySelectorAll('#sp-explore-tab .ex-row-folder').forEach((row) => {
                const cb = row.querySelector('.ex-folder-check');
                if (!cb || !cb.checked) return;
                const rel = row.dataset.relUrl;
                const name = row.dataset.name;
                const local_path = row.querySelector('.ex-local-path')?.value?.trim();
                if (rel && local_path) items.push({ name, rel_url: rel, local_path, entry_type: 'folder' });
            });
            document.querySelectorAll('#sp-explore-tab .ex-row-file').forEach((row) => {
                const cb = row.querySelector('.ex-file-check');
                if (!cb || !cb.checked) return;
                const rel = row.dataset.relUrl;
                const name = row.dataset.name;
                const local_path = row.querySelector('.ex-local-path')?.value?.trim();
                if (rel && local_path) items.push({ name, rel_url: rel, local_path, entry_type: 'file' });
            });
            if (!items.length) {
                showToast(spxT('selectOneRow'), true);
                return;
            }
            fetch('/sp/bulk_add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items }),
            })
                .then((r) => r.json().then((d) => ({ ok: r.ok, data: d })))
                .then(({ ok, data }) => {
                    if (!ok || !data.success) {
                        showToast(data.error || spxT('saveFailed'), true);
                        return;
                    }
                    showToast(spxTf('mergedReload', { n: data.merged }), false);
                    setTimeout(() => {
                        const nav = document.getElementById('nav-sp');
                        if (typeof switchTab === 'function' && nav) switchTab('sp-tab', nav);
                        window.location.reload();
                    }, 900);
                })
                .catch(() => showToast(spxT('connectionError'), true));
        });

        spxApplyLang();
</script>
